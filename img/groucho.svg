<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-labelledby="g-t">
  <title id="g-t">Un retrato dibujado a línea de un hombre con gafas redondas, cejas arqueadas, bigote grueso y un puro, como el que cuelga enmarcado en el lavadero</title>
